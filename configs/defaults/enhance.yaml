# 扩散增强核心配置（RTX 5090 基准）
# 后端为 CLI 子进程驱动（ADR-002），放大倍率运行时自动探测（infer_upscale）。
# DiffBIR 使用 2024-04 重写后的 v2.x 代码库（入口 inference.py，ADR-003）。

backend:
  name: diffbir
  diffbir:
    repo_dir: third_party/DiffBIR
    task: sr            # sr（×4 超分底座，配 1/4 预缩放）| denoise | faceSR
    version: v2.1       # 官方推荐版本（效果最好）；权重首次推理时自动下载
    upscale: 4          # 显式传给 CLI，与运行时探测互相印证
    steps: 50           # 采样步数；调试可降到 25
    cfg_scale: 8        # 生成引导强度
    captioner: none     # 不加载 LLaVA 说明模型（省显存省时间）
    noise_aug: 0
    precision: fp16     # 5090 上显存减半、速度翻倍；画质存疑时回退 fp32 对照
    seed: 0             # 透传 --seed，保证子进程采样可复现
    device: cuda:0      # CLI 只收 "cuda" 字面量，GPU 编号经 CUDA_VISIBLE_DEVICES 生效
    hf_mirror: true     # 子进程注入 HF_ENDPOINT=hf-mirror（国内自动下载权重）
    extra_args: []      # 应急通道：透传给官方 CLI 的额外参数

  resshift:                 # 保底后端（切换 backend.name=resshift 启用）
    repo_dir: third_party/ResShift
    config: third_party/ResShift/configs/sample_resshift_x4.yaml
    ckpt: weights/resshift/resshift_x4.pth
    device: cuda:0
    extra_args: []

# 分块（tile_size 是"后端输入空间"的块尺寸；×4 后端下输出块为 4 倍）
tile_size: 512
overlap: 64                # 输入空间重叠；输出空间 ×4=256 像素羽化，接缝平滑

# 预缩放：auto = 跟随后端探测倍率（×4 底座 => 4K 先降 1/4 再增强回原尺寸）
prescale: auto

seed: 0                    # 全局随机种子（可复现）
